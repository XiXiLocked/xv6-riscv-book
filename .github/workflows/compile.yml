name: Compile Book PDF
on: [push, workflow_dispatch]

jobs:
  build:
    # 直接在 Ubuntu 虚拟机上运行，不启动额外的 Docker 容器
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # 安装完整版 TeX Live 和必要的绘图工具
          # texlive-full 会直接包含 gnuplot-lua-tikz.sty
          sudo apt-get install -y \
            texlive-full \
            make \
            mpage \
            inkscape \
            gnuplot \
            git

      - name: Build Book
        run: |
          # 检查文件位置（用于调试，如果还报错可以看日志）
          kpsewhich gnuplot-lua-tikz.sty || echo "Still not found"
          
          # 直接运行 make
          make

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: Book-PDF
          path: |
            book.pdf
            xv6-src-booklet.pdf
