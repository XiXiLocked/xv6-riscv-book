name: Compile Book PDF
on: [push, workflow_dispatch]

jobs:
  build:
    # 直接在 Ubuntu 虚拟机上运行，不启动额外的 Docker 容器
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true # 🌟 确保如果字体用了 Git LFS 能够被真正下载下来

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # 安装完整版 TeX Live 和必要的绘图工具（已包含 xelatex）
          sudo apt-get install -y \
            texlive-full \
            make \
            inkscape \
            gnuplot \
            git
          # 手动下载并安装 mpage 的 deb 包
          wget http://mirrors.kernel.org/ubuntu/pool/universe/m/mpage/mpage_2.5.6+dfsg-1_amd64.deb
          sudo apt-get install -y ./mpage_2.5.6+dfsg-1_amd64.deb

      - name: Build Book
        run: |
          # 🌟 刷新系统字体缓存，确保刚提交的本地 font/ 目录字体能被 xelatex 正确识别
          sudo fc-cache -f -v

          # 检查文件位置（用于调试）
          kpsewhich gnuplot-lua-tikz.sty || echo "Still not found"
          
          # 直接运行 make（前提是你在本地已经把 Makefile 里的 pdflatex 改成了 xelatex）
          make booklet

      - name: Upload FMT Folder
        uses: actions/upload-artifact@v4
        with:
          name: xv6-booklet-fmt-files  # 下载时的压缩包名字
          path: |
            xv6-riscv-src-booklet/fmt/  # 🌟 将生成的整个 fmt 文件夹打包打包上传
