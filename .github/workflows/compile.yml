name: Compile Book PDF
on: [push, workflow_dispatch]

jobs:
  build:
    # 直接在 Ubuntu 虚拟机上运行，不启动额外的 Docker 容器
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install TeX Live and Tools
        # 只安装构建所需的最小化工具集，节省时间和空间
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-publishers \
            texlive-binaries \
            texlive-pictures \
            texlive-lua-utils \
            make \
            gnuplot \
            inkscape \
            git
      - name: Generate gnuplot-lua-tikz.sty
        # 这一步很关键，gnuplot 需要手动生成这个脚本文件给 LaTeX 使用
        run: |
          gnuplot -e "set term lua tikz"
          # 检查生成的文件是否在当前目录，如果不在，Makefile 可能会报错
          ls -l gnuplot-lua-tikz.sty

      - name: Build Book
        run: |
          # 执行项目自带的构建脚本
          make

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: Book-PDF
          path: book.pdf
