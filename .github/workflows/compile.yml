name: Compile Book PDF
on: [push, workflow_dispatch]

jobs:
  build:
    # 直接在 Ubuntu 虚拟机上运行，不启动额外的 Docker 容器
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install TeX Live and Tools
        # 只安装构建所需的最小化工具集，节省时间和空间
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-publishers \
            texlive-binaries \
            texlive-pictures \
            texlive-luatex \
            make \
            gnuplot \
            inkscape \
            git


      - name: Generate Gnuplot TikZ Styles
        # 核心步骤：直接运行 gnuplot 命令生成缺少的 .sty 文件
        run: |
          mkdir -p gnuplot_tmp
          cd gnuplot_tmp
          # 这一步会生成 gnuplot-lua-tikz.sty 和相关的 lua 文件
          gnuplot -e "set term lua tikz; set output 'dummy.tex'"
          cd ..
          # 将生成的关键文件拷贝到当前根目录，确保 LaTeX 能找到
          cp gnuplot_tmp/gnuplot-lua-tikz* .
          # 打印一下确认文件确实存在
          ls -l gnuplot-lua-tikz.sty

      - name: Build Book
        run: |
          # 增加环境变量，告诉 LaTeX 在当前目录寻找宏包
          export TEXINPUTS=.:$PATH
          make

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: Book-PDF
          path: book.pdf
